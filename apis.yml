name: Dabee
description: 'Dabee (dabee.com.br) is a Brazilian consumer-technology review and comparison
  website that helps shoppers make informed purchasing decisions about electronics and gadgets.
  It publishes hands-on reviews, side-by-side comparisons, and buying guides across notebooks,
  smartphones, tablets, monitors, smartwatches, gaming consoles, smart TVs, and networking
  equipment, with ''vale a pena'' (is-it-worth-it) verdicts and price tracking pulled from
  Amazon Brazil. The site monetizes through affiliate commissions. As of this profile it
  exposes no public developer API, documentation, or developer portal; it was surfaced as a
  500 Global portfolio lead.'
